const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(NONCE)},key,b2a(CT));return new TextDecoder().decode(pt);}
async function go(){const pw=document.getElementById('pw').value;try{const h=await dec(pw);sessionStorage.setItem('mtpw',pw);document.open();document.write(h);document.close();}catch(e){document.getElementById('er').textContent='Sai m&#7853;t kh&#7849;u';}}
window.addEventListener('load',async()=>{const s=sessionStorage.getItem('mtpw');if(s){try{const h=await dec(s);document.open();document.write(h);document.close();}catch(e){}}});
